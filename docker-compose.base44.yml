services:
  web:
    image: oven/bun:1.1
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:8080"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "bun install && bunx vite --host 0.0.0.0 --port 8080"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
